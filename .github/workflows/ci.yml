name: Enterprise Shift-Left CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-scan:
    name: Shift-Left Quality & Security Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Run Automated Unit Tests (pytest)
        run: |
          pytest -v

      - name: 2. Dependency Vulnerability Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: 3. Container & Repository Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: 4. Build Docker Container Image (Immutable Tag)
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "Building immutable Docker image: harness-demo:${IMAGE_TAG}"
          docker build -t harness-demo:${IMAGE_TAG} .
