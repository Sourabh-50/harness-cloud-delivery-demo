name: Harness Docker Delegate Host

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-harness-delegate:
    name: Run Harness Docker Delegate on Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Harness Docker Delegate with Embedded CI Runner Engine
        run: |
          echo "Starting Harness Docker Delegate with CI Runner Daemon on Port 3000..."
          docker run -d \
            --name docker-delegate \
            --net=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DELEGATE_NAME=docker-delegate \
            -e NEXT_GEN="true" \
            -e DELEGATE_TYPE="DOCKER" \
            -e ACCOUNT_ID=1G9ZhWoTSCOo9I9qLmV9VA \
            -e DELEGATE_TOKEN=ZTc2YTRiOGJjMjJhNjQ5NmRkNzZlOTY2OTQzMDdiNjg= \
            -e DELEGATE_TAGS="docker-delegate,linux-amd64" \
            -e MANAGER_HOST_AND_PORT=https://app.harness.io \
            -e RUNNER_URL="http://127.0.0.1:3000" \
            -e INIT_SCRIPT="apt-get update && apt-get install -y wget && wget -q https://github.com/drone-runners/drone-runner-docker/releases/download/v1.8.3/drone-runner-docker_linux_amd64.tar.gz -O /tmp/runner.tar.gz && tar -xzf /tmp/runner.tar.gz -C /usr/local/bin && nohup /usr/local/bin/drone-runner-docker daemon > /tmp/runner.log 2>&1 &" \
            us-docker.pkg.dev/gar-prod-setup/harness-public/harness/delegate:26.07.89707

      - name: Verify Port 3000 CI Runner Daemon Status
        run: |
          sleep 10
          echo "Checking active listening ports on host VM..."
          sudo netstat -tulpn || sudo ss -tulpn || true
          docker ps

      - name: Keep Delegate Active for Pipeline Execution
        run: |
          echo "Harness Docker Delegate ACTIVE on Cloud VM!"
          echo "Listening for pipeline executions..."
          sleep 1800
