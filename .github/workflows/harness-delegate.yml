name: Harness Docker Delegate Host

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-harness-delegate:
    name: Run Harness Delegate on Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Harness CI Lite-Engine & Delegate Stack
        run: |
          echo "Creating Harness Docker Network..."
          docker network create harness-net || true

          echo "Starting Harness CI Lite-Engine on Port 3000..."
          docker run -d \
            --name harness-ci-lite-engine \
            --network harness-net \
            -p 3000:3000 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            us-docker.pkg.dev/gar-prod-setup/harness-public/harness/ci-lite-engine:latest || true

          echo "Starting Harness Docker Delegate..."
          docker run -d \
            --name docker-delegate \
            --network harness-net \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DELEGATE_NAME=docker-delegate \
            -e NEXT_GEN="true" \
            -e DELEGATE_TYPE="DOCKER" \
            -e ACCOUNT_ID=1G9ZhWoTSCOo9I9qLmV9VA \
            -e DELEGATE_TOKEN=ZTc2YTRiOGJjMjJhNjQ5NmRkNzZlOTY2OTQzMDdiNjg= \
            -e DELEGATE_TAGS="docker-delegate,linux-amd64" \
            -e MANAGER_HOST_AND_PORT=https://app.harness.io \
            -e RUNNER_URL="http://harness-ci-lite-engine:3000" \
            us-docker.pkg.dev/gar-prod-setup/harness-public/harness/delegate:26.07.89707

      - name: Keep Delegate Active for Pipeline Execution
        run: |
          echo "Harness Delegate & CI Lite Engine ACTIVE on Cloud VM."
          echo "Listening for Harness pipeline executions..."
          sleep 1800
