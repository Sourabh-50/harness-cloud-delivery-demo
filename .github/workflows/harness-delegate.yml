name: Harness Delegate Host

on:
  workflow_dispatch:

jobs:
  run-harness-delegate:
    name: Run Harness Delegate on Cloud VM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Launch Harness Docker Delegate Container as Root User
        run: |
          docker run -d \
            --name docker-delegate \
            --net=host \
            -u 0 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DELEGATE_NAME=docker-delegate \
            -e NEXT_GEN="true" \
            -e DELEGATE_TYPE="DOCKER" \
            -e ACCOUNT_ID=1G9ZhWoTSCOo9I9qLmV9VA \
            -e DELEGATE_TOKEN=ZTc2YTRiOGJjMjJhNxQ5NmRkNzZlOTY2OTQzMDdiNjg= \
            -e DELEGATE_TAGS="docker-delegate,linux-amd64" \
            -e MANAGER_HOST_AND_PORT=https://app.harness.io \
            us-docker.pkg.dev/gar-prod-setup/harness-public/harness/delegate:26.07.89707

      - name: Keep Delegate Active for 6 Hours
        run: |
          echo "Harness Delegate ACTIVE (Root User) on Cloud VM!"
          echo "Listening for pipeline executions for 6 hours..."
          sleep 21600
