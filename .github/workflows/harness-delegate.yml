name: Harness Kubernetes Delegate Host

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-k8s-delegate:
    name: Run Harness Kubernetes Delegate on Cloud K8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Lightweight Kubernetes (k3s) & Deploy Harness Delegate
        run: |
          echo "Installing lightweight k3s Kubernetes cluster..."
          curl -sfL https://get.k3s.io | sh -
          sudo chmod 644 /etc/rancher/k3s/k3s.yaml
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          echo "Checking Kubernetes Cluster Node status..."
          kubectl get nodes

          echo "Deploying Harness Kubernetes Delegate..."
          kubectl apply -f harness-delegate.yaml

          echo "Waiting for Harness Delegate pod to start..."
          kubectl rollout status deployment/k8s-delegate -n harness-delegate-ng --timeout=180s

      - name: Keep Kubernetes Delegate Active for Pipeline Execution
        run: |
          echo "Harness Kubernetes Delegate ACTIVE on Cloud K8s Cluster!"
          echo "Listening for pipeline executions..."
          sleep 1800
